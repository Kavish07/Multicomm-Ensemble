[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multicomm-ensemble"
version = "0.1.0"
description = "Multi-LLM weighted ensemble pipeline for agentic coding frameworks"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5",
  "pillow>=10.0",
  "python-dotenv>=1.0",
  "openai>=1.40",
  "anthropic>=0.34",
  "pytest>=8.0",
]

[project.optional-dependencies]
neural = ["torch>=2.2", "sentence-transformers>=2.6", "scikit-learn>=1.4"]

[tool.setuptools.packages.find]
include = ["multicomm_ensemble*"]
